historiographical_note: >
  经济史与理论模型领域关于 1920 年代苏联经济大辩论的奠基之作。
  细致解析了普列奥布拉任斯基（“原始社会主义积累规律”）、布哈林（“蜗牛爬行速度”、“工农结合”平衡论）、沙宁（Shanin，农业优先累积）、巴扎罗夫（Bazarov）、费尔德曼（Feldman 增长模型）及斯大林派在资本积累率、工农业产品交换比价和重工业投资周期上的理论交锋。
