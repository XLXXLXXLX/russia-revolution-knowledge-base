historiographical_note: >
  当代俄罗斯后苏联档案派史学家（莫斯科国立大学教授）对 1920 年代苏联各派发展方案的深度学术争鸣专著。
  对托洛茨基“世界革命/资本主义世界分工依附论”、布哈林“蜗牛步调/曲解列宁/批判马克思”的替代方案以及斯大林派的“一国建成社会主义/本土资源动员”路径进行了尖锐的史料与理论剖析，并附有布哈林起草的十四大中央总结决议未刊草案等罕见文献。
