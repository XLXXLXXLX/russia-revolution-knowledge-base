historiographical_note: >
  当代西方新一代马克思主义史学代表作。颠覆了传统以彼得格勒与莫斯科为中心的“俄罗斯中心论”（Russian-centric bias），
  系统发掘波兰、芬兰、格鲁吉亚、乌克兰与波罗的海等非俄罗斯边疆区（Borderlands）多民族工运文献。
  论证了边疆区革命政党与工人运动在1905与1917年帝国危机中的决定性联动作用，并重新评估了考茨基正统马克思主义战略在全帝国革命工人阶级中的深刻实践与历史意义。
