historiographical_note: >
  西方学界关于苏维埃早期安全机构（契卡 Cheka）起源与制度建构的实证主义经典力作。
  全书以翔实的文献档案考证了从十月革命军事革命委员会治安职能、1917年12月列宁与捷尔任斯基创设契卡、
  1918年红色恐怖法令的推行、对左翼社会革命党与无政府主义者的镇压，直到1922年内战结束后契卡改组为国家政治保卫局（GPU）的制度制度化全过程。
