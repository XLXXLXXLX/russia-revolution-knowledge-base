historiographical_note: >
  英语学界修正派（Revisionist School）关于新经济政策（NEP）可行性与“布哈林替代方案（Bukharin Alternative）”的奠基性经典。
  系统论证了新经济政策并非权宜之计，而是一条兼顾工农联盟（Смычка）、渐进工业化与党内体制改革的社会主义可行发展道路。
