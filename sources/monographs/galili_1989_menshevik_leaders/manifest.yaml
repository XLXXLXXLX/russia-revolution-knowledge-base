historiographical_note: >
  英语学界关于 1917 年孟什维克“革命护国主义派”（以策列铁里、唐恩、齐赫泽为代表）及其与马尔托夫国际主义派分歧的权威学术专著。
  作者跳脱传统意识形态论争，从 1917 年俄国社会结构极化、工商业资产阶级政治僵化以及产业工人阶级民主诉求的角度，
  深刻剖析了为何主张工农与资产阶级民主派跨阶级合作的“联合政府策略”（Coalition）在现实政治冲击下不可避免地破产，并最终被布尔什维克击败。
