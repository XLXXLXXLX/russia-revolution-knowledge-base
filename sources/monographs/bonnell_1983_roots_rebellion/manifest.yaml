historiographical_note: >
  欧美俄国革命社会史学派（Revisionist / Social History School）开山经典之一。
  邦内尔通过对圣彼得堡和莫斯科两地手工业与现代工厂工人的阶级意识、行业协会与工会组织演变，以及 1905–1914 年间工运激进化历程的详尽实证研究，
  推翻了传统的列宁主义“外部灌输论”与自由主义/孟什维克“自发改良论”的简单两分法，系统展现了俄国熟练产业工人自下而上的自主阶级形成（Class Formation）与政治激进化机制。
