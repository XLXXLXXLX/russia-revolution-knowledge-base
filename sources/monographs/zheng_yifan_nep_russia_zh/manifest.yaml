historiographical_note: >
  中国苏联史学界泰斗郑异凡研究员五十年学术积淀的集大成之作，教育部重大社科项目《苏联史》第三卷。
  著作以海量俄国解密档案和中央会议速记为依托，客观严谨地还原了列宁对社会主义道路的曲折探索、
  工农业剪刀差与粮食危机、托洛茨基/季诺维也夫/布哈林/斯大林多轮党内大论战，以及斯大林最终以“非常措施”终结新经济政策的历史全过程，是华语学界该领域的奠基性权威巨著。
