historiographical_note: >
  社会史学派（Social History School）与经验农村社会学对 1920 年代末苏联农村危机、粮食收购体制和全盘集体化决策过程的开创性研究。
  深入剖析了农村阶级分化假说（富农/中农/贫农）的政治虚构性，详细考证了 1928 年“非常措施”（乌拉尔-西伯利亚方法）如何瓦解新经济政策机制并压制布哈林集团。
