    section_plan:
      - heading: "一、1861 年大改革的制度设计与赎买账本"
        weight: "25%"
        focus: "农奴解放法令的土地切夺与村社连环保，兼顾传统剥削论与霍赫（Steven Hoch）对赎买定价机制的统计重估。"
      - heading: "二、村社内部道德经济与乡级习惯法世界"
        weight: "20%"
        focus: "重分制村社的运作逻辑，以及乡级法院（volost court）中农民如何主动利用成文程序与习惯法处理财产权纠纷。"
