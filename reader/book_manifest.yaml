        focus: "1927 年秋冬国家谷物收购锐减的价格比价与投资过热成因（卡尔与戴维斯、勒温、艾伦），斯大林援引涅姆钦诺夫统计表的逻辑及其口径缺陷，1928 年 1 月斯大林亲赴西伯利亚动用《刑法典》第 107 条强征余粮及沙赫蒂公审制造的阶级斗争气氛。"
      - heading: "二、1928 年七月全会的“贡赋论”交锋与加米涅夫密谈隐患"
        weight: "25%"
        focus: "七月全会速记还原的正面冲撞：斯大林口头演说要求农民缴纳超额税“贡赋”，布哈林与李可夫警告非常措施将把中农推向反抗；全会妥协决议的双刃剑，以及 7 月 11 日布哈林密访加米涅夫留下的致命政治把柄。"
      - heading: "三、《一个经济学家的札记》与莫斯科堡垒的内部穿透"
        weight: "25%"
        focus: "布哈林在共产国际六大阻击“社会法西斯主义”入纲与 9 月 30 日发表《一个经济学家的札记》（“不能用未来的砖头建造现实的工厂”）；剖析斯大林如何借组织分配部人事网从区委内部瓦解乌格拉诺夫的莫斯科市委，并在十一月中央全会以保留字面妥协、拒废个别课税锁死右派。"
      - heading: "四、1929 年四月联席全会决战与“布哈林替代方案”的史学论争"
        weight: "25%"
        focus: "1929 年初密谈纪要引爆与《三人纲领》，四月中央与中监委联席全会上布哈林对“军事封建剥削”与“乌拉尔—西伯利亚法”的最后长篇抗辩、斯大林《论右倾》反击与压倒多数免职处分（仍暂留三人政治局席位，紧接十六次代表会议批准的一五计划最优方案仍预设期末集体与国营农场占播面 17.5%）；综合评析科恩、诺夫、科特金、利赫与计量经济史各派争鸣。"
    endnote_guidance:
      - "将斯大林 1928 年 7 月 9 日口头速记“相当大份额的贡赋”与全集软化版差异、以及 1929 年 4 月 22 日演说未刊速记（逮捕 200 名投机商、1924 格鲁吉亚枪决约 1,500 人）在审定本与全集中的删削层次收入尾注。"
      - "将 1929 年 4 月联席全会出席名单（301 人到会、含 245 名具表决权中委与中监委委员）及 4 月 23 日决议“压倒多数赞成、反对 10 票、弃权 3 票（原记录未清点精确赞成数）”的档案考辨收入尾注，正文只自然呈现压倒多数与 10 票反对、3 票弃权。"
